<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR File Transmitter</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <span class="title">QR File Transmitter</span>
      <div class="winbtns">
        <span class="wb min">&#8212;</span>
        <span class="wb max">&#9633;</span>
        <span class="wb close">&#10005;</span>
      </div>
    </div>

    <main class="client">
      <fieldset>
        <legend>File</legend>
        <label for="fileInput">Choose a file:</label>
        <input type="file" id="fileInput">
        <div id="fileInfo"></div>
        <div id="sendEta"></div>
      </fieldset>

      <fieldset>
        <legend>Transmission</legend>
        <div class="controls">
          <button id="startSendBtn" disabled>Start Sending</button>
          <button id="stopBtn" disabled>Stop</button>
        </div>
        <div id="qrDisplay"></div>
        <div id="status"></div>
      </fieldset>
    </main>
  </div>

  <script src="node_modules/qrcode-generator/dist/qrcode.js"></script>
  <script src="js/fileProcessor.js"></script>
  <script src="js/fountain.js"></script>
  <script src="js/encoder.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
